<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سجل التقارير اليومية</title>
<style>
  :root{
    --green-900:#3B4636;
    --green-800:#4B5842;
    --gold:#B89B5E;
    --gold-light:#D8C48F;
    --cream:#EFE8D6;
    --card:#FBF8EF;
    --row-alt:#F3EDDD;
    --ink:#2C2A22;
    --muted:#7A7361;
    --line:#DED2AC;
    --danger:#9C4A3C;
    font-family: "Georgia", "Iowan Old Style", "Palatino Linotype", serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    min-height:100vh;
  }
  .topbar{
    position:relative;
    background:var(--green-900);
    color:#F2EEDD;
    padding:18px 32px;
    min-height:150px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
  }
  .topbar-logo{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    height:130px;
    width:auto;
    pointer-events:none;
  }
  .topbar h1{
    font-family:"Georgia","Iowan Old Style","Palatino Linotype",serif;
    font-size:26px;
    font-weight:600;
    margin:0;
    letter-spacing:0.3px;
  }
  .topbar .eyebrow{
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--gold-light);
    margin-top:4px;
  }
  .nav-btns{display:flex;gap:10px;flex-shrink:0;}
  .nav-btn{
    background:transparent;
    border:1px solid var(--gold);
    color:#F2EEDD;
    padding:8px 16px;
    border-radius:999px;
    font-size:12px;
    letter-spacing:1px;
    text-transform:uppercase;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .nav-btn:hover{background:var(--gold);color:var(--green-900);}
  .nav-btn.active{background:var(--gold);color:var(--green-900);}
  .divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:14px 0 0;
    background:var(--green-900);
  }
  .divider .line{height:1px;width:120px;background:var(--gold);opacity:.7;}
  .divider .diamond{
    width:10px;height:10px;
    border:1px solid var(--gold);
    transform:rotate(45deg);
  }
  .divider-spacer{height:16px;background:var(--green-900);}

  main{
    max-width:760px;
    margin:0 auto;
    padding:36px 20px 60px;
    transition:max-width .2s ease;
  }
  main.wide{
    max-width:1400px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:6px;
    padding:28px 28px 26px;
    box-shadow:0 2px 10px rgba(59,70,54,0.08);
  }
  label{
    display:block;
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:6px;
    font-weight:600;
  }
  input[type=text], textarea, select{
    width:100%;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    padding:10px 12px;
    border-radius:4px;
    font-size:14px;
    font-family:inherit;
    outline:none;
    transition:border-color .15s ease;
  }
  input[type=text]:focus, textarea:focus, select:focus{
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(184,155,94,0.18);
  }
  textarea{resize:vertical;min-height:70px;}
  .field{margin-bottom:16px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}

  .entry-card{
    background:var(--row-alt);
    border:1px solid var(--line);
    border-inline-start:3px solid var(--gold);
    border-radius:4px;
    padding:18px 18px 6px;
    margin-bottom:16px;
    position:relative;
  }
  .entry-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
  }
  .entry-label{
    font-size:12px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--green-800);
    font-weight:700;
  }
  .remove-entry{
    background:none;
    border:none;
    color:var(--danger);
    font-size:12px;
    cursor:pointer;
    letter-spacing:0.5px;
    padding:2px 4px;
  }
  .remove-entry:hover{text-decoration:underline;}

  .add-entry-btn{
    width:100%;
    background:transparent;
    border:1px dashed var(--gold);
    color:var(--green-800);
    padding:12px;
    border-radius:4px;
    font-size:13px;
    letter-spacing:0.5px;
    cursor:pointer;
    margin-bottom:22px;
    font-family:inherit;
  }
  .add-entry-btn:hover{background:rgba(184,155,94,0.12);}

  .submit-btn{
    width:100%;
    background:var(--green-900);
    color:#F2EEDD;
    border:none;
    padding:13px;
    border-radius:4px;
    font-size:13px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    cursor:pointer;
    font-family:inherit;
  }
  .submit-btn:hover{background:var(--green-800);}
  .submit-btn:disabled{opacity:0.6;cursor:not-allowed;}

  .status{
    margin-top:14px;
    padding:12px 14px;
    border-radius:4px;
    font-size:13px;
    display:none;
  }
  .status.ok{display:block;background:#E4EADB;color:var(--green-900);border:1px solid #C6D3B4;}
  .status.err{display:block;background:#F1DFDA;color:var(--danger);border:1px solid #E0BDB4;}

  .footnote{
    text-align:center;
    color:var(--muted);
    font-size:12px;
    margin-top:22px;
    letter-spacing:0.3px;
  }

  .view{display:none;}
  .view.active{display:block;}

  h2.section-title{
    font-family:"Georgia","Iowan Old Style",serif;
    font-size:20px;
    color:var(--green-900);
    margin:0 0 18px;
  }

  .list-block{margin-bottom:24px;}
  .list-block h3{
    font-size:12px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--green-800);
    margin:0 0 8px;
  }
  .pill-list{display:flex;flex-wrap:wrap;gap:8px;}
  .pill{
    background:var(--row-alt);
    border:1px solid var(--line);
    color:var(--ink);
    padding:6px 12px;
    border-radius:999px;
    font-size:13px;
  }
  .hint{
    font-size:13px;
    color:var(--muted);
    line-height:1.6;
    background:var(--row-alt);
    border-inline-start:3px solid var(--gold);
    padding:12px 14px;
    border-radius:4px;
  }

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{
    background:var(--green-900);
    color:#F2EEDD;
    text-align:start;
    padding:9px 10px;
    font-weight:600;
    letter-spacing:0.5px;
    text-transform:uppercase;
    font-size:11px;
    position:sticky;
    top:0;
    z-index:1;
  }
  td{
    padding:9px 10px;
    border-bottom:1px solid var(--line);
    vertical-align:top;
  }
  tr:nth-child(even) td{background:var(--row-alt);}
  .table-wrap{
    overflow-x:auto;
    overflow-y:auto;
    max-height:65vh;
    border:1px solid var(--line);
    border-radius:4px;
  }
  .key-row{display:flex;gap:10px;margin-bottom:18px;}
  .key-row input{flex:1;}
  .key-row button{
    background:var(--green-900);color:#F2EEDD;border:none;
    padding:0 20px;border-radius:4px;cursor:pointer;font-size:13px;
    letter-spacing:0.5px;font-family:inherit;
  }
  .key-row button:hover{background:var(--green-800);}
  .key-row button:disabled{opacity:0.5;cursor:not-allowed;}
  .key-row button:disabled:hover{background:var(--gold);}

  .filter-bar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:16px;
    padding:14px;
    background:var(--row-alt);
    border:1px solid var(--line);
    border-radius:4px;
  }
  .filter-bar select, .filter-bar input[type=date]{
    flex:1;
    min-width:140px;
    border:1px solid var(--line);
    background:#fff;
    padding:8px 10px;
    border-radius:4px;
    font-size:13px;
    font-family:inherit;
  }
  .clear-filters-btn{
    background:transparent;
    border:1px solid var(--line);
    color:var(--muted);
    padding:8px 14px;
    border-radius:4px;
    font-size:12px;
    cursor:pointer;
    font-family:inherit;
    white-space:nowrap;
  }
  .clear-filters-btn:hover{border-color:var(--gold);color:var(--ink);}
  .empty-note{color:var(--muted);font-size:13px;padding:14px;text-align:center;}

  .pin-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(44,42,34,0.55);
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
  }
  .pin-overlay.active{display:flex;}
  .pin-box{
    background:var(--card);
    border:1px solid var(--line);
    border-top:3px solid var(--gold);
    border-radius:6px;
    padding:26px 26px 22px;
    max-width:320px;
    width:100%;
    box-shadow:0 8px 30px rgba(0,0,0,0.25);
  }
  .pin-box h3{
    margin:0 0 6px;
    font-family:"Georgia","Iowan Old Style",serif;
    font-size:18px;
    color:var(--green-900);
  }
  .pin-box p{
    margin:0 0 16px;
    font-size:13px;
    color:var(--muted);
    line-height:1.5;
  }
  .pin-box input{
    width:100%;
    border:1px solid var(--line);
    background:#fff;
    padding:10px 12px;
    border-radius:4px;
    font-size:16px;
    letter-spacing:1px;
    text-align:center;
    outline:none;
    font-family:inherit;
  }
  .pin-box input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,155,94,0.18);}
  .pin-box-actions{display:flex;gap:10px;margin-top:16px;}
  .pin-cancel{
    flex:1;background:transparent;border:1px solid var(--line);color:var(--ink);
    padding:9px;border-radius:4px;cursor:pointer;font-size:13px;font-family:inherit;
  }
  .pin-unlock{
    flex:1;background:var(--green-900);color:#F2EEDD;border:none;
    padding:9px;border-radius:4px;cursor:pointer;font-size:13px;font-family:inherit;
  }
  .pin-unlock:hover{background:var(--green-800);}
  .pin-error{display:none;color:var(--danger);font-size:12px;margin-top:10px;text-align:center;}
  .pin-error.show{display:block;}
</style>
</head>
<body>

<div id="gateOverlay" class="pin-overlay active">
  <div class="pin-box">
    <h3>الدخول إلى النظام</h3>
    <p>أدخل كلمة المرور للمتابعة إلى نموذج تسجيل التقارير.</p>
    <input type="password" id="gateInput" placeholder="كلمة المرور" autocomplete="off">
    <div class="pin-box-actions">
      <button type="button" class="pin-unlock" style="flex:1;" onclick="checkGate()">دخول</button>
    </div>
    <div class="pin-error" id="gateError">كلمة المرور غير صحيحة.</div>
  </div>
</div>
