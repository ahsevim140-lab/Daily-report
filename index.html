<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سجل التقارير اليومية</title>
<style>
  :root{
    --green-900:#3B4636;
    --green-800:#4B5842;
    --gold:#B89B5E;
    --gold-light:#D8C48F;
    --cream:#EFE8D6;
    --card:#FBF8EF;
    --row-alt:#F3EDDD;
    --ink:#2C2A22;
    --muted:#7A7361;
    --line:#DED2AC;
    --danger:#9C4A3C;
    font-family: "Georgia", "Iowan Old Style", "Palatino Linotype", serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    min-height:100vh;
  }
  .topbar{
    position:relative;
    background:var(--green-900);
    color:#F2EEDD;
    padding:18px 32px;
    min-height:150px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
  }
  .topbar-logo{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    height:130px;
    width:auto;
    pointer-events:none;
  }
  .topbar h1{
    font-family:"Georgia","Iowan Old Style","Palatino Linotype",serif;
    font-size:26px;
    font-weight:600;
    margin:0;
    letter-spacing:0.3px;
  }
  .topbar .eyebrow{
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--gold-light);
    margin-top:4px;
  }
  .nav-btns{display:flex;gap:10px;flex-shrink:0;}
  .nav-btn{
    background:transparent;
    border:1px solid var(--gold);
    color:#F2EEDD;
    padding:8px 16px;
    border-radius:999px;
    font-size:12px;
    letter-spacing:1px;
    text-transform:uppercase;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .nav-btn:hover, .nav-btn.active{background:var(--gold);color:var(--green-900);}

  .divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:14px 0 0;
    background:var(--green-900);
  }
  .divider .line{height:1px;width:120px;background:var(--gold);opacity:.7;}
  .divider .diamond{
    width:10px;height:10px;
    border:1px solid var(--gold);
    transform:rotate(45deg);
  }
  .divider-spacer{height:16px;background:var(--green-900);}

  main{
    max-width:960px;
    margin:0 auto;
    padding:36px 20px 60px;
    transition:max-width .2s ease;
  }
  main.wide{max-width:1280px;width:calc(100% - 2cm);padding:24px 12px 48px;}
  main.wide .card{padding:20px 16px;}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:6px;
    padding:28px 28px 26px;
    box-shadow:0 2px 10px rgba(59,70,54,0.08);
  }
  label{
    display:block;
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:6px;
    font-weight:600;
  }
  input[type=text], textarea, select{
    width:100%;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    padding:10px 12px;
    border-radius:4px;
    font-size:14px;
    font-family:inherit;
    outline:none;
    transition:border-color .15s ease;
  }
  input[type=text]:focus, textarea:focus, select:focus{
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(184,155,94,0.18);
  }
  textarea{resize:vertical;min-height:70px;}
  .field{margin-bottom:16px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}

  .entry-card{
    background:var(--row-alt);
    border:1px solid var(--line);
    border-inline-start:3px solid var(--gold);
    border-radius:4px;
    padding:18px 18px 6px;
    margin-bottom:16px;
    position:relative;
  }
  .entry-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
  }
  .entry-label{
    font-size:12px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--green-800);
    font-weight:700;
  }
  .remove-entry{
    background:none;
    border:none;
    color:var(--danger);
    font-size:12px;
    cursor:pointer;
    letter-spacing:0.5px;
    padding:2px 4px;
  }
  .remove-entry:hover{text-decoration:underline;}

  .add-entry-btn{
    width:100%;
    background:transparent;
    border:1px dashed var(--gold);
    color:var(--green-800);
    padding:12px;
    border-radius:4px;
    font-size:13px;
    letter-spacing:0.5px;
    cursor:pointer;
    margin-bottom:22px;
    font-family:inherit;
  }
  .add-entry-btn:hover{background:rgba(184,155,94,0.12);}

  .submit-btn{
    width:100%;
    background:var(--green-900);
    color:#F2EEDD;
    border:none;
    padding:13px;
    border-radius:4px;
    font-size:13px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    cursor:pointer;
    font-family:inherit;
  }
  .submit-btn:hover{background:var(--green-800);}
  .submit-btn:disabled{opacity:0.6;cursor:not-allowed;}

  .status{
    margin-top:14px;
    padding:12px 14px;
    border-radius:4px;
    font-size:13px;
    display:none;
  }
  .status.ok{display:block;background:#E4EADB;color:var(--green-900);border:1px solid #C6D3B4;}
  .status.err{display:block;background:#F1DFDA;color:var(--danger);border:1px solid #E0BDB4;}
  .status.info{display:block;background:#EFE8D6;color:var(--muted);border:1px solid var(--line);}

  .footnote{
    text-align:center;
    color:var(--muted);
    font-size:12px;
    margin-top:22px;
    letter-spacing:0.3px;
  }

  .view{display:none;}
  .view.active{display:block;}

  h2.section-title{
    font-family:"Georgia","Iowan Old Style",serif;
    font-size:20px;
    color:var(--green-900);
    margin:0 0 18px;
  }

  .list-block{margin-bottom:24px;}
  .list-block h3{
    font-size:12px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--green-800);
    margin:0 0 8px;
  }
  .pill-list{display:flex;flex-wrap:wrap;gap:8px;}
  .pill{
    background:var(--row-alt);
    border:1px solid var(--line);
    color:var(--ink);
    padding:6px 12px;
    border-radius:999px;
    font-size:13px;
  }
  .hint{
    font-size:13px;
    color:var(--muted);
    line-height:1.6;
    background:var(--row-alt);
    border-inline-start:3px solid var(--gold);
    padding:12px 14px;
    border-radius:4px;
  }

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{
    background:var(--green-900);
    color:#F2EEDD;
    text-align:start;
    padding:9px 10px;
    font-weight:600;
    letter-spacing:0.5px;
    text-transform:uppercase;
    font-size:11px;
    position:sticky;
    top:0;
    z-index:1;
  }
  td{
    padding:9px 10px;
    border-bottom:1px solid var(--line);
    vertical-align:top;
  }
  tr:nth-child(even) td{background:var(--row-alt);}
  .table-wrap{
    overflow-x:auto;
    overflow-y:auto;
    max-height:65vh;
    border:1px solid var(--line);
    border-radius:4px;
  }
  .key-row{display:flex;gap:10px;margin-bottom:18px;}
  .key-row input{flex:1;}
  .key-row button{
    background:var(--green-900);color:#F2EEDD;border:none;
    padding:0 20px;border-radius:4px;cursor:pointer;font-size:13px;
    letter-spacing:0.5px;font-family:inherit;
  }
  .key-row button:hover{background:var(--green-800);}
  .key-row button:disabled{opacity:0.5;cursor:not-allowed;}

  .filter-bar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:16px;
    padding:14px;
    background:var(--row-alt);
    border:1px solid var(--line);
    border-radius:4px;
  }
  .filter-bar select, .filter-bar input[type=date]{
    flex:1;
    min-width:140px;
    border:1px solid var(--line);
    background:#fff;
    padding:8px 10px;
    border-radius:4px;
    font-size:13px;
    font-family:inherit;
  }
  .clear-filters-btn{
    background:transparent;
    border:1px solid var(--line);
    color:var(--muted);
    padding:8px 14px;
    border-radius:4px;
    font-size:12px;
    cursor:pointer;
    font-family:inherit;
    white-space:nowrap;
  }
  .clear-filters-btn:hover{border-color:var(--gold);color:var(--ink);}
  .print-btn{
    background:transparent;border:1px solid var(--gold);color:var(--green-800);
    padding:8px 14px;border-radius:4px;font-size:12px;cursor:pointer;
    font-family:inherit;white-space:nowrap;
  }
  .print-btn:hover{background:rgba(184,155,94,0.12);}

  .print-header{display:none;}
  .print-report{display:none;}

  @media print{
    @page{size:A4 portrait;margin:14mm 12mm 16mm;}
    body{background:#fff;}
    #gateOverlay, .topbar, .divider, .divider-spacer, .nav-btns,
    .key-row, .filter-bar, #missingBlock, .footnote, .table-wrap,
    #viewManager > .card > .section-title{display:none !important;}
    main.wide{max-width:100%;padding:0;}
    .card{box-shadow:none;border:none;padding:0;}
    .print-header{
      display:block;
      text-align:center;
      margin:0 0 18px;
      padding:0 0 14px;
      border-bottom:2px solid var(--gold);
    }
    .print-header .print-logo{
      display:block;
      width:auto;
      height:74px;
      max-width:180px;
      object-fit:contain;
      margin:0 auto 8px;
    }
    .print-header h1{
      margin:0 0 6px;
      font-family:"Georgia","Iowan Old Style",serif;
      font-size:22px;
      line-height:1.35;
      color:var(--green-900);
    }
    .print-header h2{
      margin:0 0 6px;
      font-family:"Georgia","Iowan Old Style",serif;
      font-size:18px;
      color:var(--green-900);
    }
    .print-header .print-meta{
      font-size:13px;
      line-height:1.7;
      color:var(--muted);
    }

    .print-report{display:block;}
    .print-employee{
      margin:0 0 18px;
      page-break-inside:auto;
    }
    .print-employee-heading{
      background:var(--green-900);
      color:#fff;
      padding:9px 12px;
      margin:0 0 10px;
      font-size:17px;
      font-weight:700;
      border-radius:3px;
      -webkit-print-color-adjust:exact;
      print-color-adjust:exact;
      page-break-after:avoid;
    }
    .print-employee-dept{
      display:block;
      margin-top:3px;
      font-size:11px;
      font-weight:400;
      opacity:.9;
    }
    .print-empty{
      text-align:center;
      padding:30px 10px;
      color:var(--muted);
      font-size:13px;
      border:1px solid var(--line);
    }
  }
  .empty-note{color:var(--muted);font-size:13px;padding:14px;text-align:center;}

  .pin-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(44,42,34,0.55);
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
  }
  .pin-overlay.active{display:flex;}
  .pin-box{
    background:var(--card);
    border:1px solid var(--line);
    border-top:3px solid var(--gold);
    border-radius:6px;
    padding:26px 26px 22px;
    max-width:320px;
    width:100%;
    box-shadow:0 8px 30px rgba(0,0,0,0.25);
  }
  .pin-box h3{
    margin:0 0 6px;
    font-family:"Georgia","Iowan Old Style",serif;
    font-size:18px;
    color:var(--green-900);
  }
  .pin-box p{
    margin:0 0 16px;
    font-size:13px;
    color:var(--muted);
    line-height:1.5;
  }
  .pin-box input{
    width:100%;
    border:1px solid var(--line);
    background:#fff;
    padding:10px 12px;
    border-radius:4px;
    font-size:16px;
    letter-spacing:1px;
    text-align:center;
    outline:none;
    font-family:inherit;
  }
  .pin-box input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,155,94,0.18);}
  .pin-box-actions{display:flex;gap:10px;margin-top:16px;}
  .pin-unlock{
    flex:1;background:var(--green-900);color:#F2EEDD;border:none;
    padding:9px;border-radius:4px;cursor:pointer;font-size:13px;font-family:inherit;
  }
  .pin-unlock:hover{background:var(--green-800);}
  .pin-error{display:none;color:var(--danger);font-size:12px;margin-top:10px;text-align:center;}
  .pin-error.show{display:block;}
  .pin-loading{opacity:0.6;pointer-events:none;}

  .manager-tabs{display:flex;gap:8px;margin:0 0 16px;border-bottom:1px solid var(--line);padding-bottom:10px;}
  .manager-tab{background:transparent;border:1px solid var(--line);color:var(--green-800);padding:8px 16px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:13px;}
  .manager-tab.active{background:var(--green-900);border-color:var(--green-900);color:#fff;}
  .manager-report-panel{display:block;}
  .manager-report-panel:not(.active){display:none;}
  .attendance-panel{display:none;}
  .attendance-panel.active{display:block;}
  .attendance-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;padding:14px;background:var(--row-alt);border:1px solid var(--line);border-radius:4px;}
  .attendance-actions label{margin:0;}
  .attendance-actions input{width:auto;min-width:120px;}
  .attendance-actions select{width:auto;min-width:140px;}
  .attendance-save{background:var(--green-900);color:#fff;border:0;padding:9px 16px;border-radius:4px;cursor:pointer;font-family:inherit;}
  .attendance-table input{min-width:100px;padding:6px 8px;font-size:13px;}
  .attendance-table td,.attendance-table th{text-align:right;}
  .attendance-table .vacation-cell{text-align:center;}
  .attendance-table .vacation-check{width:auto;min-width:0;transform:scale(1.2);cursor:pointer;}

  .attendance-badge{display:inline-block;margin-top:6px;font-size:11px;padding:2px 9px;border-radius:999px;background:var(--row-alt);color:var(--green-900);font-weight:600;}
  .attendance-badge.vacation{background:#EADFF0;color:#5B3E7A;}
  .attendance-badge.late{background:#F1DFDA;color:var(--danger);}
  .attendance-badge.present{background:#E4EADB;color:var(--green-900);}
  .attendance-badge.missing{background:var(--row-alt);color:var(--muted);}
  @media print{.manager-tabs,.attendance-panel{display:none !important;}}

  /* Attendance range report (separate from the daily attendance grid) */
  .ar-panel{display:none;}
  .ar-panel.active{display:block;}
  .ar-report-header{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;margin:0 0 16px;padding:18px 20px;background:#fff;border:1px solid var(--line);border-inline-start:3px solid var(--gold);border-radius:4px;}
  .ar-report-title{margin:0;color:var(--green-900);font-size:18px;font-weight:700;}
  .ar-report-subtitle{margin:5px 0 0;color:var(--muted);font-size:12px;}
  .ar-scope{font-size:12px;color:var(--muted);text-align:left;}
  .ar-kpis{display:grid;grid-template-columns:repeat(7,minmax(105px,1fr));gap:10px;margin-bottom:20px;}
  .ar-kpi{background:#fff;border:1px solid var(--line);border-radius:4px;padding:12px 13px;min-width:0;}
  .ar-kpi-label{display:block;color:var(--muted);font-size:11px;margin-bottom:6px;}
  .ar-kpi-value{display:block;color:var(--green-900);font-size:21px;font-weight:700;line-height:1.1;}
  .ar-kpi.late .ar-kpi-value,.ar-kpi.absent .ar-kpi-value{color:var(--danger);}
  .ar-kpi.vacation .ar-kpi-value{color:#5B3E7A;}
  .ar-section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 10px;color:var(--green-900);font-size:14px;}
  .ar-section-note{font-size:11px;color:var(--muted);font-weight:400;}
  .ar-overview-wrap{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:auto;margin-bottom:22px;}
  .ar-overview{width:100%;border-collapse:collapse;min-width:760px;}
  .ar-overview th,.ar-overview td{padding:9px 11px;border-bottom:1px solid var(--line);text-align:right;font-size:12px;white-space:nowrap;}
  .ar-overview th{background:var(--row-alt);color:var(--green-800);font-weight:700;}
  .ar-overview tr:last-child td{border-bottom:0;}
  .ar-overview .employee-name{font-weight:700;color:var(--ink);}
  .ar-overview .number{text-align:center;font-variant-numeric:tabular-nums;}
  .ar-overview .exception{font-weight:700;color:var(--danger);}
  .ar-card{margin-bottom:12px;background:#fff;border:1px solid var(--line);border-inline-start:3px solid var(--gold);border-radius:4px;overflow:hidden;}
  .ar-card > summary{list-style:none;cursor:pointer;padding:13px 15px;}
  .ar-card > summary::-webkit-details-marker{display:none;}
  .ar-card > summary:hover{background:var(--row-alt);}
  .ar-employee-head{display:grid;grid-template-columns:minmax(180px,1fr) auto;align-items:center;gap:12px;}
  .ar-employee-name{color:var(--green-900);font-size:13px;font-weight:700;}
  .ar-employee-dept{display:block;color:var(--muted);font-size:11px;margin-top:3px;}
  .ar-mini-stats{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap;}
  .ar-stat{font-size:11px;padding:3px 8px;border-radius:999px;background:var(--row-alt);color:var(--green-900);white-space:nowrap;}
  .ar-stat.late,.ar-stat.absent{background:#F1DFDA;color:var(--danger);}
  .ar-stat.vacation{background:#EADFF0;color:#5B3E7A;}
  .ar-detail{padding:0 15px 15px;}
  .ar-detail .hint{margin:0 0 10px;}
  .ar-table-wrap{overflow:auto;border:1px solid var(--line);border-radius:3px;}
  .ar-table{min-width:680px;}
  .ar-table .status-pill{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:600;background:var(--row-alt);color:var(--green-900);white-space:nowrap;}
  .ar-table .status-pill.late,.ar-table .status-pill.absent{background:#F1DFDA;color:var(--danger);}
  .ar-table .status-pill.vacation{background:#EADFF0;color:#5B3E7A;}
  .ar-table .status-pill.default{opacity:.8;}
  .ar-empty{padding:14px;text-align:center;color:var(--muted);font-size:12px;}
  .ar-empty-card{background:#fff;border:1px solid var(--line);padding:22px;text-align:center;color:var(--muted);border-radius:4px;}
  @media (max-width:900px){
    .ar-kpis{grid-template-columns:repeat(4,minmax(120px,1fr));}
  }
  @media (max-width:600px){
    .ar-kpis{grid-template-columns:repeat(2,minmax(120px,1fr));}
    .ar-report-header{align-items:flex-start;}
    .ar-scope{text-align:right;}
    .ar-employee-head{grid-template-columns:1fr;}
    .ar-mini-stats{justify-content:flex-start;}
  }
  @media print{
    body.printing-ar .topbar, body.printing-ar .divider, body.printing-ar .divider-spacer,
    body.printing-ar .manager-tabs, body.printing-ar .attendance-actions,
    body.printing-ar #arStatus, body.printing-ar #reportsPanel,
    body.printing-ar #attendancePanel { display:none !important; }
    body.printing-ar .ar-panel{display:block !important;}
    body.printing-ar .ar-report-header{page-break-after:avoid;}
    body.printing-ar .ar-card{page-break-inside:avoid;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    body.printing-ar .ar-card > summary{cursor:default;}
    body.printing-ar .ar-card > summary::-webkit-details-marker{display:none;}
    body.printing-ar .ar-detail{display:block !important;}
    body.printing-ar .attendance-table th{position:static;background:var(--green-800) !important;color:#fff !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    body.printing-ar .ar-overview th{background:var(--green-800) !important;color:#fff !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }

  .att-line{margin-top:6px;}
  .attendance-badge.absent{background:#F1DFDA;color:var(--danger);}
  .attendance-note-text{display:block;margin-top:4px;font-size:11px;font-weight:400;line-height:1.4;opacity:.9;}
  .attendance-actions input[type=checkbox]{min-width:0;}

  /* ---- Entry form (nested) ---- */
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
  input[readonly]{background:var(--row-alt)!important;color:var(--muted);}
  .proj-block{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px;}
  .bld-block{background:var(--row-alt);border:1px solid var(--line);border-radius:6px;padding:14px;margin:0 10px 12px 0;}
  .task-block{background:var(--card);border:1px solid var(--line);border-inline-start:3px solid var(--gold);border-radius:4px;padding:14px 14px 4px;margin-bottom:12px;}
  .blk-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .add-entry-btn.sub{margin-bottom:12px;padding:9px;font-size:12px;}

  /* Mobile: collapse the multi-column grids on narrow screens. */
  @media (max-width:700px){
    .row2,.row3{grid-template-columns:1fr;}
  }

  /* ---- Report tables (same look on screen and in print) ---- */
  #reportsTableWrap{max-width:100%;}
  .grouped-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px;margin:0 0 16px;background:#fff;}
  .grouped-table th{position:static;background:var(--green-800);color:#F2EEDD;text-align:center;padding:9px 8px;font-size:11px;}
  .grouped-table th:nth-child(1){width:11%}
  .grouped-table th:nth-child(2){width:8%}
  .grouped-table th:nth-child(3){width:15%}
  .grouped-table th:nth-child(4){width:12%}
  .grouped-table th:nth-child(5){width:11%}
  .grouped-table th:nth-child(6){width:16%}
  .grouped-table th:nth-child(7){width:7%}
  .grouped-table th:nth-child(8){width:20%}
  .grouped-table td{padding:8px;border:1px solid var(--line);vertical-align:middle;text-align:center;overflow-wrap:anywhere;}
  .grouped-table td.merged{background:#fffdf7;font-weight:600;}
  .grouped-table td.employee-cell{background:var(--green-900);color:#fff;font-weight:700;}
  .grouped-table td.details{text-align:start;font-size:12px;color:var(--muted);white-space:pre-wrap;}
  .grouped-table td.missing-text{text-align:center;color:var(--muted);font-style:italic;background:#fff;}
  .emp-name{font-size:14px;}
  .emp-status{font-size:10px;font-weight:400;opacity:.85;margin-top:4px;}
  .task-date{display:block;font-size:10px;color:var(--muted);margin-top:2px;}

  @media print{
    .grouped-table{font-size:10.5px;margin:0 0 12px;}
    .grouped-table th,.grouped-table td{padding:5px 6px;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .grouped-table thead{display:table-header-group;}
    .grouped-table tr{break-inside:avoid;}
    .print-employee{margin:0;}
  }

  /* ---- Print overrides for unmerged print layout ---- */
  @media print{
    .print-table th:nth-child(1){width:16%}
    .print-table th:nth-child(2){width:26%}
    .print-table th:nth-child(3){width:8%}
    .print-table th:nth-child(4){width:50%}
    .print-table tr{break-inside:avoid;}
    .print-table tr.grp td{background:#EFE8D6;color:var(--green-900);font-weight:700;text-align:start;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .print-employee-heading .emp-status{color:#fff;opacity:.85;}
  }
</style>
</head>
